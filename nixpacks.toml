[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "gcc", "libffi"]

[phases.install]
cmds = [
  "python -m ensurepip --upgrade",
  "python -m pip install --upgrade pip",
  "python -m pip install -r requirements.txt"
]

[start]
cmd = "python -m gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120 --worker-class gthread --log-level info web_app:app"
